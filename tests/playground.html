<!doctype html>
<meta charset="utf-8">
<base href="../">
<title>Playground browser checks</title>
<style>
body{background:#121820;color:#d8eadf;font:14px monospace;margin:20px}canvas{image-rendering:pixelated;width:min(100%,1280px);display:block;margin:16px 0}button{font:inherit;padding:10px 18px;margin:4px;background:#273c40;color:#e3eacb;border:1px solid #6e9b83;cursor:pointer}
</style>
<h1>Playground browser checks</h1>
<p id="result">Running…</p>
<div id="scenes"></div><canvas id="game" width="640" height="360"></canvas>
<script type="module">
import { App } from './src/app.js';
import { K, V } from './src/core.js';
import { DAY_SECONDS } from './src/playground.js';
import { emptyInput } from './src/world.js';
import { UI } from './src/ui.js';
const result = document.querySelector('#result');
try {
  const levels = await (await fetch('data/levels.json')).json();
  const app = new App(document.querySelector('#game'), { levels });
  app.fade = 0; app.fadeDir = 0; app.dt = 1/60;
  const check = (ok, text) => { if (!ok) throw new Error(text); };
  const scene = (name) => {
    app.openPlayground(1234);
    const w = app.playground, T = K.Tile;
    const find = (pred) => { for (let i = -400; i < 400; i++) { const c = w.chunk(i), r = pred(c); if (r) return r; } };
    if (name === 'Night') w.time = DAY_SECONDS / 2;
    if (name === 'Lab') { const r = find((c) => { const s = c.structures.find((q) => q.kind === 'lab'); return s && { c, s }; }); w.player.pos = V((r.c.start + r.s.x0 + 5) * T, r.s.fy * T - 15); }
    if (name === 'Cave') { const r = find((c) => c.chambers.length && c); const ch = r.chambers[0]; w.player.pos = V((ch.x + 4) * T, (ch.y + ch.ry - 1) * T); }
    if (name === 'Water') {
      const r = find((c) => { for (let x = 6; x < 74; x++) if (c.surface[x] > 41 && c.surface[x - 3] > 40 && c.surface[x + 3] > 40) return { c, x }; });
      w.player.pos = V((r.c.start + r.x + 0.5) * T, 40 * T);
    }
    if (name === 'Portals') {
      const r = find((c) => { const s = c.structures.find((q) => q.kind === 'fling'); return s && { c, s }; });
      const ax = (x) => r.c.start + x, fy = r.s.fy;
      const blue = w.buildPortal(0, V(ax(r.s.x0 + 7), fy), V(0, -1), V(ax(r.s.x0 + 8) * T, fy * T));
      const orange = w.buildPortal(1, V(ax(r.s.x0 + 6), fy - 12), V(1, 0), V(ax(r.s.x0 + 7) * T, (fy - 11.5) * T));
      check(blue && orange, 'test portals must fit');
      blue.open = orange.open = 1; blue.age = orange.age = 2;
      w.portals = [blue, orange];
      w.player.pos = V((ax(r.s.x0 + 9) + 0.5) * T, fy * T - 15);
    }
    for (let i = 0; i < 30; i++) w.update(K.SimDt, emptyInput());
    w.events.length = 0;
    app.followPlayer(0, true, w); app.updateCam(0);
    app.renderer.time = w.time;
    UI.beginFrame(1/60, V(1200, 600), false, false);
    app.draw();
    return w;
  };
  for (const name of ['Day', 'Night', 'Water', 'Lab', 'Cave', 'Portals']) {
    scene(name);
    const b = document.createElement('button'); b.textContent = name;
    b.onclick = () => { scene(name); result.textContent = `PASS: viewing ${name}. All six scenes and lifecycle checks passed.`; };
    document.querySelector('#scenes').append(b);
  }
  const w = app.playground, samples = app.rec.data.length;
  app.step(w, 1/60, emptyInput(), false);
  check(app.rec.data.length === samples, 'playground must not record campaign ghosts');
  app.setScreen('menu'); check(app.playground === null, 'leaving must release playground');
  app.draw();
  app.openPlayground(1234); app.paused = true; app.draw();
  scene('Day');
  result.textContent = 'PASS: day, night, lake, lab, cave and linked outdoor/underground portal views rendered; pause/menu lifecycle passed.';
} catch(e) { result.textContent = `FAIL: ${e.stack}`; console.error(e); }
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal 2D - a pixel-art portal puzzler</title>
<meta name="description" content="Play Portal 2D in your browser: 53 test chambers, endless random tests and a map builder. A pixel-art, side-scrolling portal puzzler.">
<meta property="og:title" content="Portal 2D">
<meta property="og:description" content="A pixel-art, side-scrolling portal puzzler. Play it in your browser.">
<meta property="og:image" content="https://raw.githubusercontent.com/xandertaylorx/portal-2d-game/main/docs/media/banner.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a0b10; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, Consolas, monospace; color: #e8e2d5; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #0e1116; visibility: hidden; touch-action: none; outline: none; }
  #status { position: absolute; padding: 24px; text-align: center; max-width: 36em; line-height: 1.5; }
  #fs { position: fixed; right: 12px; bottom: 12px; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(18, 20, 27, .9); color: #e8e2d5; border: 2px solid #3a4150; cursor: pointer; opacity: .55; transition: opacity .15s, border-color .15s; z-index: 5; }
  #fs:hover { opacity: 1; border-color: #3fa7ff; }
  @media (pointer: coarse) { #touch { display: block; } }
  #touch { display: none; position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: #1d2130; color: #ffd08a; text-align: center; font-size: 13px; }
</style>
</head>
<body>
<div id="status">Loading Portal 2D...</div>
<button id="fs" tabindex="-1" title="Fullscreen (F11)" aria-label="Toggle fullscreen"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M1 1h5v2H3v3H1zM10 1h5v5h-2V3h-3zM1 10h2v3h3v2H1zM13 10h2v5h-5v-2h3z" fill="currentColor"/></svg></button>
<canvas id="game" width="640" height="360" tabindex="0"></canvas>
<div id="touch">Portal 2D needs a keyboard and mouse. Open it on a computer to play.</div>
<noscript><div style="position:absolute;padding:24px">Portal 2D needs JavaScript.</div></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>

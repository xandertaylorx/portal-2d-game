name: Deploy web build

# Publishes the game (index.html, favicon, src/, data/) to GitHub Pages: https://xandertaylorx.github.io/portal-2d-game/
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'favicon.png'
      - 'src/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site (game only, no tests)
        run: |
          mkdir _site
          cp -r index.html favicon.png src data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
